name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pytest pytest-asyncio httpx

      - name: Run backend tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-key
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: test
          KEYCLOAK_CLIENT_ID: test
        run: |
          .venv/bin/pytest backend/tests -v --tb=short

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: nexus-foundry-backend:test
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: nexus-foundry-frontend:test
          load: true

      - name: Test backend image
        run: |
          docker run --rm -d --name backend-test -p 8000:8000 \
            -e DATABASE_URL=sqlite:///./test.db \
            -e SECRET_KEY=test \
            nexus-foundry-backend:test
          sleep 10
          curl -f http://localhost:8000/health || (docker logs backend-test && exit 1)
          docker stop backend-test

      - name: Test frontend image
        run: |
          docker run --rm -d --name frontend-test -p 3000:3000 \
            nexus-foundry-frontend:test
          sleep 5
          curl -f http://localhost:3000/ || (docker logs frontend-test && exit 1)
          docker stop frontend-test
